<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Soft - Tech IT</title>
    <link rel="stylesheet" href="./web.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            height: 200px;
        }
        .contact-title {
            text-align: center;
            margin-top: 50px;
            color: #333;
            text-decoration: underline;
            font-size: 45px;
        }
        .contact-description {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 14px;
            
        }
        .contact-info {
            list-style-type: none;
            padding: 0;
            text-align: center;
            margin-top: 30px;
            font-size: 16px;
        }
        .contact-info li {
            margin-bottom: 10px;
            color: #c20202;
        }
        .contact-fieldset {
            border: 2px solid #ccc;
            border-radius: 20px;
            padding: 1px 120px 20px;
            max-width: 400px;
            margin: 50px auto;
            background-color: #f7fc00;
        }

    </style>

        
</head>
<body>
    <fieldset class="contact-fieldset">
    <h1 class="contact-title">Contact Us</h1>
    <ul class="contact-info">
        <li>📧 Email: info@softtechit.com</li>
        <li>☎️ Phone: +8801704647681</li>
    </ul>
    <p class="contact-description">🎧 Call Centre Open ( 24/7 )</p>
    </fieldset>
</body>
</html>
